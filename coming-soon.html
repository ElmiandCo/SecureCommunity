  <div class="journey-progress" aria-hidden="true"><span class="active"></span><span></span><span></span><span></span></div>

  <section class="scene scene-one" data-depth="0">
    <div class="geometry geometry-a" aria-hidden="true"></div>
    <div class="gold-dust" aria-hidden="true"></div>
    <div class="scene-copy">
      <span class="scene-number">01</span>
      <div class="logo-mark" aria-label="1 Muslim"><span>1</span><b>Muslim</b></div>

      <span class="scene-number">02</span>
      <p class="kicker">THE NEXT CHAPTER</p>

    <div class="network" aria-hidden="true"></div>

      <h2>One<br><em>Umma.</em></h2>

  <section class="scene scene-four" data-depth="3">
    <div class="ornament" aria-hidden="true"></div>
    <div class="scene-copy final-copy">
      <span class="scene-number">04</span>
      <p class="kicker">THE DESTINATION</p>
      <div class="allah" lang="ar" dir="rtl">الله</div>
      <h2>One God</h2>
      <p class="subcopy">One journey. One purpose. One Muslim.</p>
    </div>
  </section>
