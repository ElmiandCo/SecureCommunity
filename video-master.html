<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>OneMuslim Video Studio — Powered by Elmi Inc.</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#05060d;color:#fff}body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,rgba(104,73,180,.18),transparent 28%),radial-gradient(circle at 20% 80%,rgba(0,180,216,.11),transparent 30%),#05060d}.wrap{width:min(940px,100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}.stage{width:min(760px,100%);text-align:center;position:relative}.brand{font-size:13px;font-weight:900;letter-spacing:.22em;color:#e9eaf0;margin-bottom:22px}.brand span{color:#cbbcff}.visual{position:relative;width:330px;height:330px;margin:0 auto 28px;display:grid;place-items:center}.core-glow{position:absolute;width:135px;height:135px;border-radius:50%;background:radial-gradient(circle,rgba(215,180,255,.35),rgba(115,65,190,.12) 48%,transparent 72%);filter:blur(9px);animation:corePulse 2.8s ease-in-out infinite}.core{position:relative;width:108px;height:108px;border-radius:30px;border:1px solid rgba(220,211,255,.28);background:linear-gradient(145deg,#171a29,#0d101b);display:grid;place-items:center;box-shadow:0 0 45px rgba(160,118,255,.24),inset 0 0 25px rgba(255,255,255,.035);z-index:3}.film{width:48px;height:42px;border-radius:9px;background:linear-gradient(135deg,#cfc1ff,#f08dc5);position:relative;box-shadow:0 0 24px rgba(207,193,255,.3)}.film:before,.film:after{content:"";position:absolute;top:8px;bottom:8px;width:8px;border-radius:3px;background:#10131f;box-shadow:0 14px 0 #10131f}.film:before{left:7px}.film:after{right:7px}.film i{position:absolute;left:17px;right:17px;top:9px;height:8px;border-radius:3px;background:#10131f;box-shadow:0 16px 0 #10131f}.ring{position:absolute;border-radius:50%;border:1.5px solid transparent;border-top-color:#bd9cff;border-right-color:#238bd2;filter:drop-shadow(0 0 8px rgba(143,104,255,.4));z-index:1}.ring.one{width:280px;height:280px;animation:spin 5.5s linear infinite}.ring.two{width:245px;height:245px;transform:rotate(63deg);border-top-color:#f02ab8;border-left-color:#1b91e0;animation:spinReverse 7s linear infinite}.ring.three{width:205px;height:205px;transform:rotate(-28deg);border-bottom-color:#a76cff;border-right-color:#18a8e8;animation:spin 4.2s linear infinite}.ring.orbit{width:310px;height:120px;border:1.5px solid rgba(103,154,255,.65);transform:rotate(-23deg);animation:orbitTilt 6.5s linear infinite}.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#d9ccff;box-shadow:0 0 12px #bba5ff;z-index:4}.p1{animation:particle1 3.2s linear infinite}.p2{animation:particle2 4.1s linear infinite}.p3{animation:particle3 2.7s linear infinite}.p4{animation:particle4 5s linear infinite}.p5{animation:particle5 3.8s linear infinite}.p6{animation:particle6 4.6s linear infinite}.label{font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:-.035em;margin:0}.label span{background:linear-gradient(90deg,#fff,#d8c8ff,#f49bc9);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{margin:12px 0 0;color:#969cab;font-size:16px}.loading{width:230px;height:5px;background:#202534;border-radius:99px;margin:28px auto 16px;overflow:hidden}.bar{width:48%;height:100%;border-radius:99px;background:linear-gradient(90deg,#bca6ff,#f18bc8,#6fc9ff);animation:load 2.2s ease-in-out infinite}.status{font-size:11px;color:#777f90;letter-spacing:.18em;text-transform:uppercase}.powered{margin-top:38px;font-size:11px;color:#707786;letter-spacing:.12em}.powered b{color:#d5d7df}.actions{margin-top:22px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:12px 17px;border-radius:12px;text-decoration:none;font-size:13px;font-weight:800}.primary{background:#eee7ff;color:#12101a}.secondary{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035);color:#dfe2ea}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinReverse{to{transform:rotate(-360deg)}}@keyframes orbitTilt{0%{transform:rotate(-23deg) scaleX(1)}50%{transform:rotate(157deg) scaleX(1.02)}100%{transform:rotate(337deg) scaleX(1)}}@keyframes corePulse{0%,100%{transform:scale(.9);opacity:.65}50%{transform:scale(1.12);opacity:1}}@keyframes load{0%{transform:translateX(-115%)}50%{transform:translateX(45%)}100%{transform:translateX(230%)}}@keyframes particle1{0%{transform:translate(0,-140px)}25%{transform:translate(125px,-35px)}50%{transform:translate(0,140px)}75%{transform:translate(-125px,-35px)}100%{transform:translate(0,-140px)}}@keyframes particle2{0%{transform:translate(0,125px)}25%{transform:translate(-110px,0)}50%{transform:translate(0,-125px)}75%{transform:translate(110px,0)}100%{transform:translate(0,125px)}}@keyframes particle3{0%{transform:translate(-120px,50px)}33%{transform:translate(70px,-100px)}66%{transform:translate(115px,75px)}100%{transform:translate(-120px,50px)}}@keyframes particle4{0%{transform:translate(110px,-80px)}50%{transform:translate(-100px,80px)}100%{transform:translate(110px,-80px)}}@keyframes particle5{0%{transform:translate(-70px,-105px)}50%{transform:translate(80px,100px)}100%{transform:translate(-70px,-105px)}}@keyframes particle6{0%{transform:translate(130px,35px)}50%{transform:translate(-125px,-30px)}100%{transform:translate(130px,35px)}}@media(max-width:600px){.wrap{padding:20px}.visual{width:280px;height:280px;margin-bottom:22px}.ring.one{width:240px;height:240px}.ring.two{width:210px;height:210px}.ring.three{width:175px;height:175px}.ring.orbit{width:270px;height:105px}.core{width:92px;height:92px}.film{transform:scale(.88)}.sub{font-size:14px}.powered{margin-top:30px}}@media(prefers-reduced-motion:reduce){.ring,.particle,.core-glow,.bar{animation:none}.bar{transform:none;width:48%}}
</style>
</head>
<body>
<div class="wrap">
<main class="stage" aria-label="OneMuslim Video Studio">
  <div class="brand">ONEMUSLIM <span>CREATIVE</span></div>
  <div class="visual" aria-hidden="true">
    <div class="ring one"></div><div class="ring two"></div><div class="ring three"></div><div class="ring orbit"></div>
    <div class="core-glow"></div>
    <div class="core"><div class="film"><i></i></div></div>
    <div class="particle p1"></div><div class="particle p2"></div><div class="particle p3"></div><div class="particle p4"></div><div class="particle p5"></div><div class="particle p6"></div>
  </div>
  <h1 class="label">OneMuslim <span>Video Studio</span></h1>
  <p class="sub">AI-powered video creation for the OneMuslim community.</p>
  <div class="loading" role="progressbar" aria-label="Loading Video Studio"><div class="bar"></div></div>
  <div class="status">Preparing your creative workspace</div>
  <div class="powered">POWERED BY <b>ELMI INC.</b></div>
  <div class="actions">
    <a class="btn primary" href="https://abdirisaqoamfz4.lastapp.dev">Launch Video Studio →</a>
    <a class="btn secondary" href="/coming-soon.html">← Back to Coming Soon</a>
  </div>
</main>
</div>
</body>
</html>
